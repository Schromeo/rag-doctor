[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-doctor"
version = "0.1.0"
description = "Diagnose retrieval, grounding, and citation failures in RAG systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "RAG Doctor Contributors" }
]
keywords = ["rag", "llm", "evaluation", "diagnostics", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
rag-doctor = "rag_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
